name: SHOP.BIN
sha1: 09645449948177200d87cb9350a87df165e34453
options:
  base_path: ../../
  basename: SHOP.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/SHOP.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/shop.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/shop
  src_path: src/overlays/shop
  build_path: build/overlays/shop

  ld_script_path: linker/overlays/shop/shop.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/overlays/shop/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/shop/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/symbols/shop_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: shop
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    subsegments:
      - [0x1, rodata, rodata]
      - [0x5, c, shop_init]                   # gcc272_cdk, func_80140004 + func_801400D4, 100%
      - [0x165, c, unk1_after_init]
      - [0x799, c, shop_update_interp]          # gcc272_cdk, func_80140798, 100%
      - [0x839, c, unk1_after_interp]
      - [0xD4D, c, shop_element_utils]          # gcc272_cdk, 3 funcs, 100%
      - [0xE01, c, unk1_mid]
      - [0x2131, c, shop_string_utils]          # gcc272_cdk, 3 funcs, 100%
      - [0x2285, c, unk1_tail]
      - [0x234D, c, shop_element_init_a]       # gcc272_cdk, func_8014234C, 100%
      - [0x2401, c, unk1_tail_mid]
      - [0x28F1, c, shop_element_init_b]       # gcc272_cdk, func_801428F0, 100%
      - [0x29A5, c, unk1_tail_end]
      - [0x2D05, data, data]
  - [0x5CE5]