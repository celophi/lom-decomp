name: GNAME.BIN
sha1: e428114bd699f557d3508a4f26a8e3c2c495db29
options:
  base_path: ../../
  basename: GNAME.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/GNAME.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/gname.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/gname
  src_path: src/overlays/gname
  build_path: build/overlays/gname

  ld_script_path: linker/overlays/gname/gname.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/overlays/gname/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/gname/undefined_syms_auto.txt

  symbol_addrs_path:    
    - config/symbols/shared_symbol_addrs.txt
    - config/symbols/gname_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: gname
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [0x1, .rodata, gname]
      - [0x5, c, gname]
      - start: 0x2C99
        type: index_boundaries
        name: panel_record_boundaries
        dir: gname
        expected_count: 5
      - start: 0x2CAD
        type: index_map
        name: kanji_category_map
        dir: gname
        expected_count: 10
        unmapped_value: 0xFF
      - start: 0x2CD5
        type: glyph_metrics
        name: glyph_table
        dir: gname
        expected_count: 39
      - start: 0x2E0D
        type: tab_cursor_layout
        name: tab_cursor_layout
        dir: gname
        expected_count: 13
      - start: 0x2E41
        type: index_boundaries
        name: kanji_entry_offsets
        dir: gname
        expected_count: 45
      - start: 0x2EF5
        type: name_entry_resource
        name: name_records
        dir: gname
      - start: 0x7495
        type: tim
        name: name_entry
        dir: gname
      # Original build artifact: duplicates the final 32-bit pixel word of name_entry.tim.
      # It is outside the TIM's declared sections and is retained for binary matching.
      - start: 0xF6B5
        type: databin
        name: name_entry_tail
        dir: gname
      - start: 0xF6B9
        type: sprite_layout
        name: layout_sprite_sequence
        dir: gname
        expected_count: 20
      - start: 0xF759
        type: sprite_animation
        name: glyph_append_anim
        dir: gname
        frame_count: 7
        sprites_per_frame: 3
        trailing_padding: 4
      - [0xF7B1, .bss, gname]
  - [0xF8D9]
