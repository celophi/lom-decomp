name: GNAME.BIN
sha1: e428114bd699f557d3508a4f26a8e3c2c495db29
options:
  base_path: ../../
  basename: GNAME.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/GNAME.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/gname.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/gname
  src_path: src/overlays/gname
  build_path: build/overlays/gname

  ld_script_path: linker/overlays/gname/gname.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/overlays/gname/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/gname/undefined_syms_auto.txt

  symbol_addrs_path:    
    - config/symbols/shared_symbol_addrs.txt
    - config/symbols/gname_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: gname
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    subsegments:
      - [0x1, rodata, rodata]
      - [0x3E1, c, gname]
      # Constant tables + panel-blob header, now defined in gname.c.
      - [0x2C99, .data, gname]
      # Panel data blob body: opaque, only reached via offset arithmetic from
      # the header-field symbols, so no named symbol is needed. Extracted as a
      # binary incbin rather than disassembled.
      - [0x301D, databin, panel_data]
      # Name-entry glyph TIM image (g_name_entry_tim symbol emitted on top).
      - [0x7495, databin, name_entry_tim]
      # Remaining initialized tables: g_name_cursor_glyphs, g_char_append_anim.
      - [0xF6B9, data, data]
      # Zero-init runtime state (g_custom_name_buf .. g_char_cursor). These are
      # uninitialized globals, so they belong in .bss. On PSX ld_bss_is_noload
      # defaults to False, so this .bss is still file-backed and matches.
      - [0xF7B1, bss, data]
  - [0xF8D9]