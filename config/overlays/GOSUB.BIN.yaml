name: GOSUB.BIN
sha1: 1361a14f2d461fd99c2e9d5d4f5e70b7704bb098
options:
  base_path: ../../
  basename: GOSUB.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/GOSUB.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/gosub.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/gosub
  src_path: src/overlays/gosub
  build_path: build/overlays/gosub

  ld_script_path: linker/overlays/gosub/gosub.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/overlays/gosub/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/gosub/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/symbols/shared_symbol_addrs.txt
    - config/symbols/gosub_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: gosub
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, gosub]
      - [0x69, rodatabin, group_first_indices]
      - [0x75, rodatabin, group_counts]
      - [0x81, c, gosub]       # CDK (default)
      - [0x7059, databin, image_archive]
      - [0xF27D, databin, text_archive_offsets_0]
      - [0xF281, databin, text_archive_offsets_1]
      - [0xF289, databin, text_archive_offsets_2]
      - [0xF295, databin, text_archive_offsets_3]
      - [0xF29D, databin, message_archive_offset]
      - [0xF2A5, databin, text_archive_offsets_5]
      - [0xF2A9, databin, text_archive_offsets_6]
      - [0xF2C5, databin, text_archive_0]
      - [0x12DF5, databin, text_archive_1]
      - [0x2B3DD, databin, font_texture]
      - [0x2B5AD, databin, item_metadata]
      - [0x2B635, databin, glyph_metrics]
      - [0x2B8C9, .bss, gosub]
  - [0x34A5D]
