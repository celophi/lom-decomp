name: CARDA.BIN
sha1: 8c553e14f4426011ff9b19c07d50f44fbc537413
options:
  base_path: ../../
  basename: CARDA.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/CARDA.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/carda.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/carda
  src_path: src/overlays/carda
  build_path: build/overlays/carda

  ld_script_path: linker/overlays/carda/carda.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/overlays/carda/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/carda/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/symbols/carda_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: carda
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    subsegments:
      - [0x1, rodata, rodata]
      - [0x371, c, unk1]
      - [0x95E5, c, carda_stream_reset]        # gcc272_cdk, 2 funcs, 100%
      - [0x9691, c, unk1_mid1]
      - [0x986D, c, carda_shutdown_handles]    # gcc272_cdk, 1 func, 100%
      - [0x991D, c, unk1_mid2]
      - [0x9FED, c, carda_handles]             # gcc272_cdk, 4 funcs, 100%
      - [0xA1C5, c, unk1_tail]
      - [0xADF9, c, carda_cache_table]          # gcc272_cdk, 3 funcs, 100%
      - [0xAEC5, c, unk1_tail2]
      - [0xB039, data, data]
  - [0x2F001]