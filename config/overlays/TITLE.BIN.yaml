name: TITLE.BIN
sha1: 4df07f0d2b3a850751f74d91c5ca96a1fdbb998e
options:
  base_path: ../../
  basename: TITLE.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/TITLE.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/title.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/title
  src_path: src/overlays/title
  build_path: build/overlays/title

  ld_script_path: linker/overlays/title/title.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/overlays/title/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/title/undefined_syms_auto.txt

  symbol_addrs_path:    
    - config/symbols/shared_symbol_addrs.txt
    - config/symbols/title_symbol_addrs.txt
    
  reloc_addrs_path:
    - config/relocations/title_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: title
    type: decompress_overlay
    start: 0x1
    vram: 0x8004FC70
    align: 4
    subsegments:
      - [0x1, .rodata, title]
      - [0x5, c, title]
      - [0x2679, databin, title_menu_tim_table]
      - start: 0x2685
        type: tim
        name: title_menu_tim_0
        dir: title
      - start: 0xA8A5
        type: tim
        name: title_menu_tim_1
        dir: title
        # Original build artifact: the final 32-bit TIM pixel word is repeated.
        trailing_duplicate_word: true
      - [0x300BD, databin, cursor_blink_palette]
      - [0x300C1, databin, save_layout_tim_00]
      - [0x532E5, databin, save_layout_tim_01]
      - [0x5B329, databin, save_layout_tim_02]
      - [0x5F7CD, databin, save_layout_tim_03]
      - [0x63C71, databin, save_layout_tim_04]
      - [0x64235, databin, save_layout_tim_05]
      - [0x66679, databin, save_layout_tim_06]
      - [0x738BD, databin, save_layout_tim_07]
      - [0x80B01, databin, save_layout_tim_08]
      - [0x89745, databin, save_layout_tim_09]
      - [0x99969, databin, save_layout_tim_10]
      - [0xA9B89, databin, save_layout_gap]
      - [0xA9B8D, databin, save_layout_texture_table]
      - [0xA9C3D, databin, save_layout_uv_0]
      - [0xA9C85, databin, save_layout_uv_1]
      - [0xA9CCD, databin, save_layout_table]
      - [0xA9F55, databin, save_slot_data]
      - [0xAA215, databin, menu_layout_default]
      - [0xAEB09, databin, menu_layout_default_tail]
      - [0xAF2D1, databin, menu_layout_alternate]
      - [0xB2531, databin, submenu_layout_default]
      - [0xB2781, databin, submenu_layout_continue]
      - [0xB29D1, databin, title_runtime_state]
  - [0xB2A5D]
