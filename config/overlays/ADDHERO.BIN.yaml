name: ADDHERO.BIN
sha1: 960ecb0253546dc843333c261f43d7f4b9876aba
options:
  base_path: ../../
  basename: ADDHERO.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/ADDHERO.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/addhero.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/addhero
  src_path: src/overlays/addhero
  build_path: build/overlays/addhero

  ld_script_path: linker/overlays/addhero/addhero.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/overlays/addhero/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/addhero/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/symbols/addhero_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: addhero
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    subsegments:
      - [0x1, rodata, rodata]
      - [0x11D, c, unk1]
      - [0xC95, c, addhero_core_state]         # gcc272_cdk, 3 funcs, 100%
      - [0xD81, c, unk1_core_tail]
      - [0x1DF1, c, addhero_terminate_multibyte_text] # gcc272_cdk, 1 func, 100%
      - [0x1E55, c, unk1_text_gap]
      - [0x24AD, c, addhero_string_utils]       # gcc272_cdk, 4 funcs, 100%
      - [0x2619, c, unk1_before_choice]
      - [0x4009, c, addhero_choice_prompt]      # gcc272_cdk, 2 funcs, 100%
      - [0x4141, c, unk1_choice_gap]
      - [0x4195, c, addhero_checksum]           # gcc272_cdk, 1 func, 100%
      - [0x41CD, c, unk1_checksum_gap]
      - [0x43A9, c, addhero_hex_parse]          # gcc272_cdk, 2 funcs, 100%
      - [0x4479, c, unk1_before_rank]
      - [0x49F1, c, addhero_reset_entry_ranks] # gcc272_cdk, 1 func, 100%
      - [0x4A29, c, unk1_after_rank]
      - [0x5825, c, addhero_stream_reset]      # gcc272_cdk, 2 funcs, 100%
      - [0x58D1, c, unk1_mid1]
      - [0x5A9D, c, addhero_shutdown_handles]  # gcc272_cdk, 1 func, 100%
      - [0x5B4D, c, unk1_mid2]
      - [0x5FC1, c, addhero_handles]           # gcc272_cdk, 4 funcs, 100%
      - [0x6199, c, unk1_tail]
      - [0x65C9, c, addhero_draw_signed_decimal] # gcc272_cdk, 1 func, 100%
      - [0x67E9, c, unk1_tail_mid]
      - [0x686D, c, addhero_text_render]       # gcc272_cdk, 3 funcs, 100%
      - [0x6D65, c, addhero_cache_table]       # gcc272_cdk, 3 funcs, 100%
      - [0x6E31, c, addhero_expand_text_glyph_codes] # gcc272_cdk, 1 func, 100%
      - [0x6FA5, data, data]
  - [0x2D941]