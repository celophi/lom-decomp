name: ADDHERO.BIN
sha1: 960ecb0253546dc843333c261f43d7f4b9876aba
options:
  base_path: ../../
  basename: ADDHERO.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/ADDHERO.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/addhero.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/addhero
  src_path: src/overlays/addhero
  build_path: build/overlays/addhero

  ld_script_path: linker/overlays/addhero/addhero.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/overlays/addhero/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/addhero/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/symbols/addhero_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: addhero
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, addhero]
      - [0x89, rodatabin, addhero_format_overflow_and_file_template]
      - [0x99, rodatabin, addhero_load_jump_table]
      - [0x115, rodatabin, addhero_entry_header_template]
      - [0x11D, c, addhero]                  # gcc272_cdk, 0x11D-0x6FA5
      - [0x6FA5, databin, addhero_data]
  - [0x2D941]
