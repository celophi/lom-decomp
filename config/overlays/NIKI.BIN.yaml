name: NIKI.BIN
sha1: 3b9b790808857196f157e258dafa63177bcefcb6
options:
  base_path: ../../
  basename: NIKI.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/NIKI.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/niki.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/niki
  src_path: src/overlays/niki
  build_path: build/overlays/niki

  ld_script_path: linker/overlays/niki/niki.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/overlays/niki/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/niki/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/symbols/niki_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: niki
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, niki]
      - [0x51, rodatabin, niki_rodata_padding]
      - [0x55, rodatabin, niki_state_page_jump_table]
      - [0x89, rodatabin, niki_decimal_prefix]
      - [0x91, rodatabin, niki_file_template]
      - [0x99, rodatabin, niki_load_jump_table]
      - [0x115, rodatabin, niki_entry_header_template]
      - [0x11D, c, niki]                     # gcc272_cdk, consolidated NIKI C, baseline preserved
      - [0x70F9, databin, niki_data]
  - [0x2DA81]
