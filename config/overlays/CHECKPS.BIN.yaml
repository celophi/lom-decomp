name: CHECKPS.BIN
sha1: 388f95071ba5107108eeeb2296439871c22c4185
options:
  base_path: ../../
  basename: CHECKPS.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/CHECKPS.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/checkps.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/checkps
  src_path: src/overlays/checkps
  build_path: build/overlays/checkps

  ld_script_path: linker/overlays/checkps/checkps.ld
  ld_dependencies: True
  ld_legacy_generation: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  undefined_funcs_auto_path: linker/overlays/checkps/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/checkps/undefined_syms_auto.txt

  symbol_addrs_path:    
    - config/symbols/shared_symbol_addrs.txt
    - config/symbols/checkps_symbol_addrs.txt

  reloc_addrs_path:
    - config/relocations/checkps_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: checkps
    type: decompress_overlay
    start: 0x1
    vram: 0x8004FC70
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      # Data-only C TU: the auto text anchor makes Splat emit a full target
      # cdrom_data.s for objdiff while linking the real sections from C.
      - [auto, c, cdrom_data]
      - [0x5, .rodata, cdrom]
      # Shift-JIS hardware-modification warning: an opaque packed text blob,
      # extracted as a raw rodatabin asset rather than hardcoded .word data.
      - start: 0x55
        type: rodatabin
        name: hardware_modification_warning
        dir: checkps
      # Pattern vertex signs + trailing padding. These leave pattern.o's rodata
      # too: GNU as rounds that section's size up to a 16-byte multiple, and the
      # 60-byte warning was what previously made the combined block land on that
      # boundary. Extracted as a maspsx-assembled rodatabin (no 16-byte rounding)
      # so the following init .text still starts at its original address.
      - start: 0x91
        type: rodatabin
        name: pattern_vertex_signs
        dir: checkps
      - [0xA5, c, init]
      - [0xE95, c, cdrom]
      - [0x1BC1, c, kanji]
      - [0x1DB5, c, pattern]
      - [0x1F45, c, font]
      # Large binary payloads extracted as raw databin assets (see GOLEM/GOSUB):
      # the embedded AKAO music sequence and the TIM boot image are opaque blobs
      # and must not be hardcoded as .word tables in the linked assembly.
      - start: 0x27B9
        type: databin
        name: embedded_akao
        dir: checkps
      - start: 0xBAD5
        type: databin
        name: image_asset
        dir: checkps
      # Residual small tables (CD command table, register/state vars, glyph
      # lookup tables) remain readable .data.
      - [0xD321, data, table]
      - [0xD3E5, .data, font]
      - [0xD3F1, .bss, init]
      - [0x31441, .data, cdrom_data]
      - [0x31451, .bss, font]
  - [0x39869]
