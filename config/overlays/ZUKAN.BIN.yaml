name: ZUKAN.BIN
sha1: ccb3e4f650a62146e703c033ab869fa4a42ce600
options:
  base_path: ../../
  basename: ZUKAN.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/BIN/ZUKAN.BIN
  extensions_path: tools/splat_ext
  asset_path: assets
  elf_path: build/overlays/zukan.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/overlays/zukan
  src_path: src/overlays/zukan
  build_path: build/overlays/zukan

  ld_script_path: linker/overlays/zukan/zukan.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/overlays/zukan/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/overlays/zukan/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/symbols/zukan_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: zukan
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, rodata, rodata]
      # All optimized functions (0x80141094..0x80142CA0) live in one gcc272_cdk
      # translation unit. Every function verified byte-identical to its former
      # standalone file: 23 at 100%, func_80141DF4 at 98.5% WIP, func_80142B3C
      # at 99.887640% WIP. The gcc280_g0-tagged functions (scroll_window,
      # gpu_modes, func_80141988, outline_fade) also match under gcc272_cdk, so
      # they merged in too.
      - [0x1095, c, zukan] # gcc272_cdk, func_80141094..func_80142CA0
      - [0x2D09, c, func_80142D08] # gcc280_g0_o0, func_80142D08, 100% (only -O0 func)
      - [0x471D, data, data]
  - [0x17D7D]