name: CARDA.BIN
compressed_sha1: 22615b343b5e34973a5184732972a75dfd4d15fc
sha1: 88ba3ce3fc216a5563fac1c5dee3de08885a956a
options:
  base_path: ../../../
  basename: CARDA.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: build/jp/decompressed/CARDA.BIN
  asset_path: assets/jp
  elf_path: build/jp/overlays/carda.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/carda
  src_path: src/overlays/carda
  build_path: build/jp/overlays/carda

  ld_script_path: linker/jp/overlays/carda/carda.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/carda/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/carda/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/jp/symbols/carda_symbol_addrs.txt

  reloc_addrs_path:
    - config/jp/relocations/carda_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: carda
    type: code
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, carda]
      - [0x1B9, .rodata, carda_card]
      - [0x24D, c, carda]
      - [0x71B9, c, carda_card]
      - [0xA631, c, carda_glyph]
      - [0xB00D, databin, carda_data]
  - [0x2FD79]
