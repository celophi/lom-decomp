name: WMAP.BIN
sha1: c4416ac415650a7b4445a48d60d06e4a4365cf5c
options:
  base_path: ../../../
  basename: WMAP.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: disc/jp/BIN/WMAP.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/wmap.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/wmap
  src_path: src/overlays/wmap
  build_path: build/jp/overlays/wmap

  ld_script_path: linker/jp/overlays/wmap/wmap.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/wmap/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/wmap/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/jp/symbols/shared_symbol_addrs.txt
    - config/jp/symbols/wmap_symbol_addrs.txt

  reloc_addrs_path:
    - config/jp/relocations/wmap_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

