name: FIELD.BIN
sha1: faa38ef95132afabb9e43851b0bc8961cefd7ff8
options:
  base_path: ../../../
  basename: FIELD.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: disc/jp/BIN/FIELD.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/field.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/field
  src_path: src/overlays/field
  build_path: build/jp/overlays/field

  ld_script_path: linker/jp/overlays/field/field.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/field/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/field/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/jp/symbols/shared_symbol_addrs.txt
    - config/jp/symbols/field_symbol_addrs.txt

  reloc_addrs_path:
    - config/jp/relocations/field_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: field
    type: decompress_overlay
    start: 0x1
    vram: 0x8004FDD8
    align: 4
    subsegments:
      - [auto, c, overlay_header] # overlay metadata
      - [0x1, .rodata, overlay_header]
      - [0x5, rodata, field_scene_build]  # JP: differs from US, kept as assembly
      - [0x79, rodata, field_animation]  # JP: differs from US, kept as assembly
      - [0x115, .rodata, field_scene_control]
      - [0x129, .rodata, field_collision]
      - [0x155, rodata, field_text]  # JP: differs from US, kept as assembly
      - [0x1D5, rodata, field_effect_update] # field7/8/9 animation + placement, frame and actor update switch tables
      - [0x5C9, .rodata, field_mesh_render]
      - [0x5E1, rodata, field_actor_hud_effects] # func_80086494 eight-entry animation-kind jump table
      - [0x601, .rodata, field_actor_script_ops] # func_80088198/func_80089980/func_8008B288 tables; the zero word at 0x8005095C is intra-object jtbl alignment
      - [0xE7D, rodata, field_actor_behavior] # field_update_actor_command + field_apply_action_animation (58-entry) jump tables
      - [0x10D5, rodata, field_actor_state_updates] # func_80092AD8 + func_80092C98 movement-state tables, then the twenty-entry actor sequence switch; the zero word at 0x80051008 is intra-object jtbl alignment
      - [0x133D, .rodata, field_contact_geometry] # func_80099018 (30-entry) + func_80099A48 (20-entry) reaction switches
      - [0x1405, rodata, field_actor_effects] # func_8009D4D8 movement-mode table, 4-byte jtbl alignment pad, func_8009D95C + func_8009D9E0 switch tables
      - [0x1481, rodata, field_command_history] # func_800A29F8 128-entry input command jump table
      - [0x1681, .rodata, field_audio_runtime] # func_800A3FB0 five-entry audio transfer state jump table
      - [0x1695, .rodata, field_dialog_screens] # func_800A5960 five-entry effect switch, func_800A838C phase table
      - [0x16C9, rodata, unk2_rodata_2_after_a838c]
      - [0x174D, rodata, field_modal_runtime] # field_update_modal nine-entry and six-entry modal-state tables
      - [0x178D, rodata, field_interaction_start] # eight-entry action installation table
      - [0x17AD, .rodata, field_actor_lifecycle] # 45-entry layout jump table
      - [0x1861, .rodata, field_action_descriptors] # descriptor-selection tables
      - [0x1909, .rodata, field_action_setup] # six-entry action jump table
      - [0x1921, rodata, field_record_stat_ops]  # JP: differs from US, kept as assembly
      - [0x1941, rodata, field_script_ops] # flow/primary/pair jump tables (79-entry runtime subcommand table last)
      - [0x1B0D, .rodata, field_script_commands] # actor and record command jump tables
      - [0x1B4D, .rodata, field_reward_command_ops]
      - [0x1B69, rodata, unk2_rodata_after_bdca4]

      # Scene loading, construction, rendering, animation, and text.
      - [0x2209, asm, field_scene_load] # gcc_280_g4_noexpand
      - [0x28F1, asm, field_scene_build] # gcc_280_g4_noexpand
      - [0x6CAD, asm, field_animation] # gcc_280_g4_noexpand
      - [0x955D, c, field_scene_control] # gcc_280_g4_noexpand
      - [0xB611, c, field_collision] # gcc_280_g4_noexpand
      - [0x1343D, asm, field_text] # gcc_280_g4_noexpand

      # Frame orchestration and actor resource runtime.
      - [0x17595, c, field_frame_commands]
      - [0x177B5, c, field_subsystem_init]
      - [0x17985, c, field_draw_state]
      - [0x17A6D, c, field_fade]
      - [0x17E91, c, field_actor_runtime]

      # Effect updates, primitive generation, geometry, and mesh transforms.
      - [0x1D67D, asm, field_effect_update]  # JP: differs from US, kept as assembly
      - [0x2FEA9, c, field_mesh_render]
      - [0x32185, asm, field_mesh_transform]  # JP: differs from US, kept as assembly
      - [0x331D1, c, field_mesh_part_animation]

      # Actor resources, script commands, input, movement, and state machines.
      - [0x33829, c, field_actor_slot_resources]
      - [0x345E1, asm, field_actor_hud_effects]  # JP: differs from US, kept as assembly
      - [0x37385, c, field_actor_key_ops]
      - [0x37E5D, c, field_actor_script_ops]
      - [0x3B5E1, c, field_actor_reactions]
      - [0x3C499, asm, field_actor_behavior]  # JP: differs from US, kept as assembly
      - [0x41139, c, field_actor_input_map_init]
      - [0x41241, c, field_actor_action_defaults]
      - [0x41451, asm, field_actor_input_actions]  # JP: differs from US, kept as assembly
      - [0x41845, c, field_actor_camera]
      - [0x4206D, c, field_actor_idle_ops]
      - [0x42269, asm, field_actor_motion]  # JP: differs from US, kept as assembly
      - [0x42821, asm, field_actor_state_updates]  # JP: differs from US, kept as assembly
      - [0x46851, c, field_actor_transition_reset]

      # Contact geometry, scene transitions, actor effects, and paths.
      - [0x47211, c, field_contact_geometry]
      - [0x4A405, c, field_actor_resource_unpack]
      - [0x4B11D, asm, field_scene_transition]  # JP: differs from US, kept as assembly
      - [0x4C761, c, field_text_window_api]
      - [0x4CB49, c, field_block_allocator]
      - [0x4CDA1, c, field_actor_target_queries]
      - [0x4D619, asm, field_actor_effects]  # JP: differs from US, kept as assembly
      - [0x51E5D, c, field_path_interpolation]

      # Command history, audio, dialogs, and field UI.
      - [0x52671, asm, field_command_history]  # JP: differs from US, kept as assembly
      - [0x52F19, c, field_pair_indicators]
      - [0x5360D, c, field_audio_runtime]
      - [0x544C1, c, field_ring_selection]
      - [0x55711, c, field_dialog_screens]
      - [0x58979, asm, field_modal_runtime]  # JP: differs from US, kept as assembly
      - [0x5CEAD, c, field_modal_stream_start]
      - [0x5D085, c, field_numeric_sprites]
      - [0x5D659, c, field_pair_rule_lookup]
      - [0x5D6CD, c, field_menu_windows]
      - [0x5E725, c, field_coordinate_icon]
      - [0x5EB9D, c, field_choice_labels]
      - [0x5ECA5, c, field_item_selection]
      - [0x5F741, c, field_text_session]
      - [0x5F7CD, asm, field_text_quad]  # JP: differs from US, kept as assembly
      - [0x5FC91, c, field_card_clock]
      - [0x5FFED, c, field_character_name_flags]

      # Resource installation, actor records, action setup, and status.
      - [0x60079, c, field_resource_load]
      - [0x60975, asm, field_interaction_start]  # JP: differs from US, kept as assembly
      - [0x6268D, c, field_event_dispatch]
      - [0x628BD, c, field_party_state]
      - [0x63C15, c, field_actor_templates]
      - [0x641B1, c, field_actor_lifecycle]
      - [0x646D9, c, field_status_ticks]
      - [0x64ED9, c, field_action_descriptors]
      - [0x65355, c, field_action_setup]
      - [0x65E9D, asm, field_progression_ops]  # JP: differs from US, kept as assembly
      - [0x66001, asm, field_action_modifiers]  # JP: differs from US, kept as assembly
      - [0x677BD, asm, field_record_stat_ops]  # JP: differs from US, kept as assembly

      # Script dispatch and opcode families.
      - [0x67E35, asm, field_script_ops]  # JP: differs from US, kept as assembly
      - [0x6CF59, c, field_script_operands]
      - [0x6D525, c, field_script_commands]
      - [0x6E3F9, c, field_script_arith_ops]

      # Record creation, rewards, growth, queries, and counters.
      - [0x6E541, asm, field_record_setup_ops]  # JP: differs from US, kept as assembly
      - [0x6F111, asm, field_slot_pool_ops]  # JP: differs from US, kept as assembly
      - [0x6F8F5, asm, field_generated_record_ops]  # JP: differs from US, kept as assembly
      - [0x7005D, asm, field_record_effect_ops]  # JP: differs from US, kept as assembly
      - [0x70835, c, field_reward_command_ops]
      - [0x70C15, asm, field_record_growth_ops]  # JP: differs from US, kept as assembly
      - [0x7182D, asm, field_record_lookup_ops]  # JP: differs from US, kept as assembly
      - [0x71CD5, c, field_record_buffer_ops]
      - [0x71DC9, c, field_record_position_queries]
      - [0x71EA1, asm, field_stat_counter_ops]  # JP: differs from US, kept as assembly
      - [0x72071, c, field_saved_slot_ops]
      - [0x7244D, c, field_actor_record_ops]
      - [0x72705, c, field_resource_table_ops]
      - [0x72921, c, field_active_record_ops]
      - [0x731F1, asm, field_record_table_ops]  # JP: differs from US, kept as assembly

      # Group layouts, menu records, equipment rules, and golem logic.
      - [0x737F9, c, field_group_layout_ops]
      - [0x73D11, c, field_group_stat_transfer]
      - [0x7415D, c, field_group_derived_stats]
      - [0x754FD, asm, field_menu_ops]  # JP: differs from US, kept as assembly
      - [0x79CC9, c, field_select_distance_bucket]
      - [0x79F95, c, field_layout_slot_state]
      - [0x7A07D, c, field_equipment_combination_rules]
      - [0x7B475, c, field_golem_logic_blocks]
      - [0x7BD39, data, data]
      - start: 0x7BD79
        type: tim
        name: field_resource
        dir: field
        trailing_duplicate_word: true
      - [0x8C59D, databin, field_resource_blob]      # g_field_resource_blob: word 1 is the payload length (see func_80083948)
      - [0x9ADCD, data, data_b]
      - [0x9DC61, databin, clut_800EDED8]            # 512 BGR555 entries
      - [0x9E061, databin, clut_800EE2D8]            # 256 BGR555 entries
      - [0x9E261, data, data_c]
      - [0x9F385, databin, rect_table_800EF64C]      # 64 RECTs (x, y, w, h halfwords)
      - [0x9F585, data, data_d]
  - [0xD0C89]
