name: FIELD.BIN
compressed_sha1: faa38ef95132afabb9e43851b0bc8961cefd7ff8
sha1: 98969aa7b0093b043fef5e993f342e7f9cefcc30
options:
  base_path: ../../../
  basename: FIELD.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: build/jp/decompressed/FIELD.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/field.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/field
  src_path: src/overlays/field
  build_path: build/jp/overlays/field

  ld_script_path: linker/jp/overlays/field/field.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/field/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/field/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/jp/symbols/shared_symbol_addrs.txt
    - config/jp/symbols/field_symbol_addrs.txt

  reloc_addrs_path:
    - config/jp/relocations/field_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: field
    type: code
    start: 0x1
    vram: 0x8004FDD8
    align: 4
    subsegments:
      - [auto, c, overlay_header] # overlay metadata
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, scene/field_scene_build]
      - [0x79, .rodata, actors/field_animation]
      - [0x115, .rodata, scene/field_scene_control]
      - [0x129, .rodata, scene/field_collision]
      - [0x155, .rodata, ui/field_text]
      - [0x1D5, .rodata, render/field_effect_update] # field7/8/9 animation + placement, frame and actor update switch tables
      - [0x5C9, .rodata, render/field_mesh_render]
      - [0x5E1, .rodata, actors/field_actor_hud_effects] # func_80086494 eight-entry animation-kind jump table
      - [0x601, .rodata, actors/field_actor_script_ops] # func_80088198/func_80089980/func_8008B288 tables; the zero word at 0x8005095C is intra-object jtbl alignment
      - [0xE7D, .rodata, actors/field_actor_behavior] # field_update_actor_command + field_apply_action_animation (58-entry) jump tables
      - [0x10D5, .rodata, actors/field_actor_state_updates] # func_80092AD8 + func_80092C98 movement-state tables, then the twenty-entry actor sequence switch; the zero word at 0x80051008 is intra-object jtbl alignment
      - [0x133D, .rodata, scene/field_contact_geometry] # func_80099018 (30-entry) + func_80099A48 (20-entry) reaction switches
      - [0x1405, .rodata, actors/field_actor_effects] # func_8009D4D8 movement-mode table, 4-byte jtbl alignment pad, func_8009D95C + func_8009D9E0 switch tables
      - [0x1481, .rodata, actors/field_command_history] # func_800A29F8 128-entry input command jump table
      - [0x1681, .rodata, runtime/field_audio_runtime] # func_800A3FB0 five-entry audio transfer state jump table
      - [0x1695, .rodata, ui/field_dialog_screens] # func_800A5960 five-entry effect switch, func_800A838C phase table
      - [0x16C9, rodata, unk2_rodata_2_after_a838c]
      - [0x174D, .rodata, ui/field_modal_runtime] # field_update_modal nine-entry and six-entry modal-state tables
      - [0x178D, .rodata, scene/field_interaction_start] # eight-entry action installation table
      - [0x17AD, .rodata, actors/field_actor_lifecycle] # 45-entry layout jump table
      - [0x1861, .rodata, scripts/field_action_descriptors] # descriptor-selection tables
      - [0x1909, .rodata, scripts/field_action_setup] # six-entry action jump table
      - [0x1921, .rodata, records/field_record_stat_ops]
      - [0x1941, .rodata, scripts/field_script_ops] # flow/primary/pair jump tables (79-entry runtime subcommand table last)
      - [0x1B0D, .rodata, scripts/field_script_commands] # actor and record command jump tables
      - [0x1B4D, .rodata, records/field_reward_command_ops]
      - [0x1B69, rodata, unk2_rodata_after_bdca4]

      # Scene loading, construction, rendering, animation, and text.
