name: GOSUB.BIN
sha1: 5f7729f9ef7ebae83432d4e2db31a1234d567e9f
options:
  base_path: ../../../
  basename: GOSUB.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: disc/jp/BIN/GOSUB.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/gosub.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/gosub
  src_path: src/overlays/gosub
  build_path: build/jp/overlays/gosub

  ld_script_path: linker/jp/overlays/gosub/gosub.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/gosub/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/gosub/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/jp/symbols/shared_symbol_addrs.txt
    - config/jp/symbols/gosub_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: gosub
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, gosub]
      - [0x55, .rodata, gosub_selection]
      - start: 0x69
        type: rodatabin
        name: group_first_indices
        dir: gosub
      - start: 0x75
        type: rodatabin
        name: group_counts
        dir: gosub
      - [0x81, c, gosub]       # CDK (default)
      - [0xC19, c, gosub_elements]
      - [0x16E1, c, gosub_lists]
      - [0x229D, c, gosub_selection]
      - [0x3225, c, gosub_runtime]
      - [0x3B31, c, gosub_render]
      - [0x5491, c, gosub_dialogs]
      - [0x6589, c, gosub_helpers]
      - start: 0x7025
        type: databin
        name: image_archive
        dir: gosub
      - start: 0xF249
        type: databin
        name: text_archive
        dir: gosub
      - start: 0x12C3D
        type: databin
        name: portrait_archive
        dir: gosub
      - start: 0x2B225
        type: databin
        name: font_texture
        dir: gosub
      - start: 0x2B3F5
        type: databin
        name: item_metadata
        dir: gosub
      - start: 0x2B47D
        type: databin
        name: glyph_metrics
        dir: gosub
      - [0x2B711, .bss, gosub]
  - [0x348A5]
