name: CHECKPS.BIN
compressed_sha1: 237ab08b237827691b91bc8917348a251e449f11
sha1: 3e1bbd617609bae80df17ef04952bdded75ab531
options:
  base_path: ../../../
  basename: CHECKPS.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: build/jp/decompressed/CHECKPS.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/checkps.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/checkps
  src_path: src/overlays/checkps
  build_path: build/jp/overlays/checkps

  ld_script_path: linker/jp/overlays/checkps/checkps.ld
  ld_dependencies: True
  ld_legacy_generation: True
  ld_align_section_vram_end: False
  ld_align_segment_vram_end: False
  undefined_funcs_auto_path: linker/jp/overlays/checkps/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/checkps/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/jp/symbols/shared_symbol_addrs.txt
    - config/jp/symbols/checkps_symbol_addrs.txt

  reloc_addrs_path:
    - config/jp/relocations/checkps_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: checkps
    type: code
    start: 0x1
    vram: 0x8004FDD8
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, cdrom]
      # pattern.o .rodata, extracted as a raw asset: the Shift-JIS warning text,
      # the vertex signs, and the 12 zero bytes GNU as pads the section with.
      - [0x55, rodatabin, checkps_pattern_rodata]
      - [0xA5, c, init]
      - [0x10B9, c, cdrom]
      - [0x1DE5, c, kanji]
      - [0x1FD9, c, pattern]
      - [0x2169, c, font]
      - [0x29DD, databin, checkps_data]
      - [0x13FF9, bss, init]  # JP: differs from US, kept as assembly
      - [0x38431, .bss, cdrom]
      - [0x38441, .bss, font]
  - [0x40859]
