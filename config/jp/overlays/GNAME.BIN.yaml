name: GNAME.BIN
sha1: 549a0cd0f66267c8b9e8683575793ba99a0f6a6d
options:
  base_path: ../../../
  basename: GNAME.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: disc/jp/BIN/GNAME.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/gname.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/gname
  src_path: src/overlays/gname
  build_path: build/jp/overlays/gname

  ld_script_path: linker/jp/overlays/gname/gname.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/gname/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/gname/undefined_syms_auto.txt

  symbol_addrs_path:    
    - config/jp/symbols/shared_symbol_addrs.txt
    - config/jp/symbols/gname_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: gname
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, c, gname]
      - [0x2C6D, databin, panel_record_boundaries]  # JP: data differs from US, split raw
      - [0x2C81, databin, kanji_category_map]  # JP: data differs from US, split raw
      - start: 0x2D49
        type: glyph_metrics
        name: glyph_table
        dir: gname
        expected_count: 39
      - start: 0x2E81
        type: tab_cursor_layout
        name: tab_cursor_layout
        dir: gname
        expected_count: 13
      - start: 0x2EB5
        type: index_boundaries
        name: kanji_entry_offsets
        dir: gname
        expected_count: 45
      - [0x2F69, databin, name_records]  # JP: data differs from US, split raw
      - start: 0x7A09
        type: tim
        name: name_entry
        dir: gname
        trailing_duplicate_word: true
      - start: 0xFC2D
        type: sprite_layout
        name: layout_sprite_sequence
        dir: gname
        expected_count: 20
      - [0xFCCD, databin, glyph_append_anim]  # JP: data differs from US, split raw
      - [0xFD21, .bss, gname]
  - [0xFE45]
