name: TITLE.BIN
compressed_sha1: 38bfb06a8d9c742935a2bfa754246c4d19f658b8
sha1: d50b0b0c7f5bcc11ebbaa788093e92ad5462f8a7
options:
  base_path: ../../../
  basename: TITLE.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: build/jp/decompressed/TITLE.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/title.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/title
  src_path: src/overlays/title
  build_path: build/jp/overlays/title

  ld_script_path: linker/jp/overlays/title/title.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/title/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/title/undefined_syms_auto.txt

  symbol_addrs_path:    
    - config/jp/symbols/shared_symbol_addrs.txt
    - config/jp/symbols/title_symbol_addrs.txt
    
  reloc_addrs_path:
    - config/jp/relocations/title_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: title
    type: code
    start: 0x1
    vram: 0x8004FDD8
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, c, title]
      - [0x145D, c, title_save]
      - [0x25D1, databin, title_data]
  - [0xB29B5]
