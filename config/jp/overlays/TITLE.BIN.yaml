name: TITLE.BIN
sha1: 38bfb06a8d9c742935a2bfa754246c4d19f658b8
options:
  base_path: ../../../
  basename: TITLE.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: disc/jp/BIN/TITLE.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/title.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/title
  src_path: src/overlays/title
  build_path: build/jp/overlays/title

  ld_script_path: linker/jp/overlays/title/title.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/title/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/title/undefined_syms_auto.txt

  symbol_addrs_path:    
    - config/jp/symbols/shared_symbol_addrs.txt
    - config/jp/symbols/title_symbol_addrs.txt
    
  reloc_addrs_path:
    - config/jp/relocations/title_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: title
    type: decompress_overlay
    start: 0x1
    vram: 0x8004FDD8
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, c, title]
      - [0x145D, c, title_save]
      - start: 0x25D1
        type: asset_offset_table
        name: title_menu_tim_table
        dir: title
        targets:
          - title_menu_tim_0
          - title_menu_tim_1
      - start: 0x25DD
        type: tim
        name: title_menu_tim_0
        dir: title
      - start: 0xA7FD
        type: tim
        name: title_menu_tim_1
        dir: title
        trailing_duplicate_word: true
      - start: 0x30015
        type: u8_sequence
        name: cursor_blink_u_offsets
        dir: title
        expected_count: 4
      - start: 0x30019
        type: tim
        name: save_layout_tim_00
        dir: title
        trailing_duplicate_word: true
      - start: 0x5323D
        type: tim
        name: save_layout_tim_01
        dir: title
        trailing_duplicate_word: true
      - start: 0x5B281
        type: tim
        name: save_layout_tim_02
        dir: title
        trailing_duplicate_word: true
      - start: 0x5F725
        type: tim
        name: save_layout_tim_03
        dir: title
        trailing_duplicate_word: true
      - start: 0x63BC9
        type: tim
        name: save_layout_tim_04
        dir: title
        trailing_duplicate_word: true
      - start: 0x6418D
        type: tim
        name: save_layout_tim_05
        dir: title
        trailing_duplicate_word: true
      - start: 0x665D1
        type: tim
        name: save_layout_tim_06
        dir: title
        trailing_duplicate_word: true
      - start: 0x73815
        type: tim
        name: save_layout_tim_07
        dir: title
        trailing_duplicate_word: true
      - start: 0x80A59
        type: tim
        name: save_layout_tim_08
        dir: title
        trailing_duplicate_word: true
      - start: 0x8969D
        type: tim
        name: save_layout_tim_09
        dir: title
        trailing_duplicate_word: true
      - start: 0x998C1
        type: tim
        name: save_layout_tim_10
        dir: title
        trailing_duplicate_word: true
      - start: 0xA9AE5
        type: tim_upload_table
        name: save_layout_texture_table
        dir: title
        targets:
          - save_layout_tim_00
          - save_layout_tim_01
          - save_layout_tim_02
          - save_layout_tim_03
          - save_layout_tim_04
          - save_layout_tim_05
          - save_layout_tim_06
          - save_layout_tim_07
          - save_layout_tim_08
          - save_layout_tim_09
          - save_layout_tim_10
      - start: 0xA9B95
        type: uv_rect_table
        name: save_slot_panel_uvs
        dir: title
        unit_pixels: 8
        expected_count: 12
      - start: 0xA9BDD
        type: uv_rect_table
        name: save_slot_sprite_uvs
        dir: title
        unit_pixels: 8
        expected_count: 12
      - [0xA9C25, databin, save_layout_table]  # JP: data differs from US, split raw
      - [0xA9EAD, databin, starting_weapon_records]  # JP: data differs from US, split raw
      - [0xAA16D, databin, new_game_state_template]  # JP: data differs from US, split raw
      - [0xAF229, databin, menu_layout_alternate]
      - [0xB2489, databin, submenu_layout_default]
      - [0xB26D9, databin, submenu_layout_continue]
      - [0xB2929, databin, title_runtime_state]
  - [0xB29B5]
