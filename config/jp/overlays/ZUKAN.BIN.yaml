name: ZUKAN.BIN
sha1: e3b595d0879e05d2bc3c0eea42772a845c7cea04
options:
  base_path: ../../../
  basename: ZUKAN.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: disc/jp/BIN/ZUKAN.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/zukan.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/zukan
  src_path: src/overlays/zukan
  build_path: build/jp/overlays/zukan

  ld_script_path: linker/jp/overlays/zukan/zukan.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/zukan/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/zukan/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/jp/symbols/shared_symbol_addrs.txt
    - config/jp/symbols/zukan_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: zukan
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, zukan]
      - [0x1D, rodatabin, zukan_category_ranges]
      - [0x51, rodatabin, zukan_group_ranges]
      - [0x6D, rodatabin, zukan_entry_values]
      - [0x861, rodatabin, zukan_display_order]
      - [0x1095, c, zukan] # gcc272_cdk
      - [0x2D09, c, zukan_category] # gcc280_g0_o0
      - [0x471D, databin, g_zukan_resource_archive]
      - [0x16B99, databin, g_zukan_ui_sprites]
      - [0x16C99, databin, g_zukan_resource_buffer]
      - [0x16CA1, databin, g_zukan_exit_requested]
      - [0x16CA9, databin, g_zukan_list_entries]
      - [0x174A9, databin, g_zukan_fade_target]
      - [0x174AF, databin, g_zukan_input_blocked]
      - [0x174B1, databin, g_zukan_category]
      - [0x174B5, databin, g_zukan_entry_count]
      - [0x174B9, databin, g_zukan_previous_resource_id]
      - [0x174C1, databin, g_zukan_fade_current]
      - [0x174C9, databin, g_zukan_displayed_entry]
      - [0x174CD, databin, g_zukan_transition_frame]
      - [0x174D1, databin, g_zukan_view_mode]
      - [0x174D5, databin, g_zukan_image_mode]
      - [0x174D9, databin, g_zukan_selected_entry]
      - [0x174DD, databin, g_zukan_transition_state]
      - [0x174E1, databin, g_zukan_scroll_steps]
      - [0x174E5, databin, g_zukan_work_buffer]
      - [0x174E9, databin, g_zukan_scroll_y]
      - [0x174ED, databin, g_zukan_scroll_target_y]
      - [0x174F1, databin, g_zukan_next_resource_id]
  - [0x174F5]
