name: NIKI.BIN
sha1: 65f913246b043d5eed0f7b83f545c6292da9cbf9
options:
  base_path: ../../../
  basename: NIKI.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: disc/jp/BIN/NIKI.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/niki.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/niki
  src_path: src/overlays/niki
  build_path: build/jp/overlays/niki

  ld_script_path: linker/jp/overlays/niki/niki.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/niki/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/niki/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/jp/symbols/niki_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: niki
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, rodata, niki]  # JP: differs from US, kept as assembly
      - [0x99, .rodata, niki_io]
      - [0x11D, asm, niki]  # JP: differs from US, kept as assembly
      - [0x4DE5, c, niki_io]
      - [0x70E5, databin, niki_data]
  - [0x2E859]
