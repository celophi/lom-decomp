sha1: ed7252e8cee9eb112c4aa2fc0b0cc814a4f3333c
options:
  base_path: ../../../
  basename: ADDHERO.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: build/jp/decompressed/ADDHERO.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/jp
  elf_path: build/jp/overlays/addhero.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/jp/overlays/addhero
  src_path: src/overlays/addhero
  build_path: build/jp/overlays/addhero

  ld_script_path: linker/jp/overlays/addhero/addhero.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/jp/overlays/addhero/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/jp/overlays/addhero/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/jp/symbols/addhero_symbol_addrs.txt

  reloc_addrs_path:
    - config/jp/relocations/addhero_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: addhero
    type: code
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, addhero]
      - [0x25, .rodata, addhero_widgets]
      - [0x89, rodatabin, addhero_format_overflow_and_file_template]
      - [0x99, .rodata, addhero_card]
      - [0x115, rodatabin, addhero_entry_header_template]
      - [0x11D, c, addhero]
      - [0x2615, c, addhero_widgets]
      - [0x41C5, c, addhero_card]
      - [0x65C1, c, addhero_glyph]
      - [0x6F9D, databin, addhero_data]
  - [0x2E721]
