name: TITLE.BIN
compressed_sha1: 4df07f0d2b3a850751f74d91c5ca96a1fdbb998e
sha1: af10eaf5b976cbd1ec19cb1d13c84827058403d8
options:
  base_path: ../../../
  basename: TITLE.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: build/us/decompressed/TITLE.BIN
  asset_path: assets/us
  elf_path: build/us/overlays/title.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/us/overlays/title
  src_path: src/overlays/title
  build_path: build/us/overlays/title

  ld_script_path: linker/us/overlays/title/title.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/us/overlays/title/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/us/overlays/title/undefined_syms_auto.txt

  symbol_addrs_path:    
    - config/us/symbols/shared_symbol_addrs.txt
    - config/us/symbols/title_symbol_addrs.txt
    
  reloc_addrs_path:
    - config/us/relocations/title_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: title
    type: code
    start: 0x1
    vram: 0x8004FC70
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, c, title]
      - [0x14CD, c, title_save]
      - [0x2679, databin, title_data]
  - [0xB2A5D]
