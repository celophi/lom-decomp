name: CLOAD.BIN
sha1: 9aa31d6f62ee68bff73bbe0e8b4416e34bb20e58
options:
  base_path: ../../../
  basename: CLOAD.BIN
  platform: psx
  compiler: PSYQ
  target_path: disc/us/BIN/CLOAD.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/us
  elf_path: build/us/overlays/cload.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/us/overlays/cload
  src_path: src/overlays/cload
  build_path: build/us/overlays/cload

  ld_script_path: linker/us/overlays/cload/cload.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/us/overlays/cload/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/us/overlays/cload/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/us/symbols/cload_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: cload
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, cload]
      - [0x25, .rodata, cload_widgets]
      - [0x39, .rodata, cload_card]
      - [0xC5, c, cload]     # gcc272_cdk
      - [0x2481, c, cload_widgets]
      - [0x3649, c, cload_card]
      - [0x54C1, c, cload_glyph]
      - [0x5E9D, databin, cload_data]
  - [0x2B259]