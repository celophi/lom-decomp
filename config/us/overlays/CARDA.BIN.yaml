name: CARDA.BIN
compressed_sha1: 8c553e14f4426011ff9b19c07d50f44fbc537413
sha1: d5dee6a90d843d9c04ef68b7e49cf6a99fee5817
options:
  base_path: ../../../
  basename: CARDA.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: build/us/decompressed/CARDA.BIN
  asset_path: assets/us
  elf_path: build/us/overlays/carda.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/us/overlays/carda
  src_path: src/overlays/carda
  build_path: build/us/overlays/carda

  ld_script_path: linker/us/overlays/carda/carda.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/us/overlays/carda/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/us/overlays/carda/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/us/symbols/carda_symbol_addrs.txt

  reloc_addrs_path:
    - config/us/relocations/carda_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: carda
    type: code
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, carda]
      - [0x1B9, rodatabin, g_decimal_overflow_text]
      - [0x1C1, rodatabin, g_carda_card_path_prefix]
      - [0x1C9, .rodata, carda_card]
      - [0x245, rodatabin, g_carda_card_search_path]
      - [0x24D, c, carda]
      - [0x71E5, c, carda_card]
      - [0xA65D, c, carda_glyph]
      - [0xB039, databin, carda_data]
  - [0x2F001]
