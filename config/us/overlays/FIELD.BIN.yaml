name: FIELD.BIN
sha1: 5b0325f90d55daef8321606d9a439238b0a5518d
options:
  base_path: ../../../
  basename: FIELD.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: disc/us/BIN/FIELD.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/us
  elf_path: build/us/overlays/field.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/us/overlays/field
  src_path: src/overlays/field
  build_path: build/us/overlays/field

  ld_script_path: linker/us/overlays/field/field.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/us/overlays/field/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/us/overlays/field/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/us/symbols/shared_symbol_addrs.txt
    - config/us/symbols/field_symbol_addrs.txt

  reloc_addrs_path:
    - config/us/relocations/field_reloc_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: field
    type: decompress_overlay
    start: 0x1
    vram: 0x8004FC70
    align: 4
    subsegments:
      - [auto, c, overlay_header] # overlay metadata
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, scene/field_scene_build]
      - [0x79, .rodata, actors/field_animation]
      - [0x115, .rodata, scene/field_scene_control]
      - [0x129, .rodata, scene/field_collision]
      - [0x155, .rodata, ui/field_text]
      - [0x285, .rodata, render/field_effect_update] # field7/8/9 animation + placement, frame and actor update switch tables
      - [0x679, .rodata, render/field_mesh_render]
      - [0x691, .rodata, actors/field_actor_hud_effects] # func_80086494 eight-entry animation-kind jump table
      - [0x6B1, .rodata, actors/field_actor_script_ops] # func_80088198/func_80089980/func_8008B288 tables; the zero word at 0x8005095C is intra-object jtbl alignment
      - [0xF2D, .rodata, actors/field_actor_behavior] # field_update_actor_command + field_apply_action_animation (58-entry) jump tables
      - [0x1185, .rodata, actors/field_actor_state_updates] # func_80092AD8 + func_80092C98 movement-state tables, then the twenty-entry actor sequence switch; the zero word at 0x80051008 is intra-object jtbl alignment
      - [0x13ED, .rodata, scene/field_contact_geometry] # func_80099018 (30-entry) + func_80099A48 (20-entry) reaction switches
      - [0x14B5, .rodata, actors/field_actor_effects] # func_8009D4D8 movement-mode table, 4-byte jtbl alignment pad, func_8009D95C + func_8009D9E0 switch tables
      - [0x1531, .rodata, actors/field_command_history] # func_800A29F8 128-entry input command jump table
      - [0x1731, .rodata, runtime/field_audio_runtime] # func_800A3FB0 five-entry audio transfer state jump table
      - [0x1745, .rodata, ui/field_dialog_screens] # func_800A5960 five-entry effect switch, func_800A838C phase table
      - [0x1779, rodata, unk2_rodata_2_after_a838c]
      - [0x17FD, .rodata, ui/field_modal_runtime] # field_update_modal nine-entry and six-entry modal-state tables
      - [0x183D, .rodata, scene/field_interaction_start] # eight-entry action installation table
      - [0x185D, .rodata, actors/field_actor_lifecycle] # 45-entry layout jump table
      - [0x1911, .rodata, scripts/field_action_descriptors] # descriptor-selection tables
      - [0x19B9, .rodata, scripts/field_action_setup] # six-entry action jump table
      - [0x19D1, .rodata, records/field_record_stat_ops]
      - [0x19F1, .rodata, scripts/field_script_ops] # flow/primary/pair jump tables (79-entry runtime subcommand table last)
      - [0x1BBD, .rodata, scripts/field_script_commands] # actor and record command jump tables
      - [0x1BFD, .rodata, records/field_reward_command_ops]
      - [0x1C19, rodata, unk2_rodata_after_bdca4]

      # Scene loading, construction, rendering, animation, and text.
      - [0x22B9, c, scene/field_scene_load] # gcc_280_g4_noexpand
      - [0x29B9, c, scene/field_scene_build] # gcc_280_g4_noexpand
      - [0x6D95, c, actors/field_animation] # gcc_280_g4_noexpand
      - [0x9645, c, scene/field_scene_control] # gcc_280_g4_noexpand
      - [0xB6F9, c, scene/field_collision] # gcc_280_g4_noexpand
      - [0x13525, c, ui/field_text] # gcc_280_g4_noexpand

      # Frame orchestration and actor resource runtime.
      - [0x17A45, c, scripts/field_frame_commands]
      - [0x17C65, c, runtime/field_subsystem_init]
      - [0x17E35, c, render/field_draw_state]
      - [0x17F1D, c, render/field_fade]
      - [0x18341, c, actors/field_actor_runtime]

      # Effect updates, primitive generation, geometry, and mesh transforms.
      - [0x1DB2D, c, render/field_effect_update]
      - [0x30359, c, render/field_mesh_render]
      - [0x32635, c, render/field_mesh_transform]
      - [0x33681, c, render/field_mesh_part_animation]

      # Actor resources, script commands, input, movement, and state machines.
      - [0x33CD9, c, actors/field_actor_slot_resources]
      - [0x34A91, c, actors/field_actor_hud_effects]
      - [0x379A5, c, actors/field_actor_key_ops]
      - [0x3847D, c, actors/field_actor_script_ops]
      - [0x3BC01, c, actors/field_actor_reactions]
      - [0x3CAB9, c, actors/field_actor_behavior]
      - [0x417A1, c, actors/field_actor_input_map_init]
