      - [0x42E69, c, actors/field_actor_state_updates]
      - [0x46A81, c, actors/field_actor_transition_reset]

      # Contact geometry, scene transitions, actor effects, and paths.
      - [0x47441, c, scene/field_contact_geometry]
      - [0x4A635, c, actors/field_actor_resource_unpack]
      - [0x4B34D, c, scene/field_scene_transition]
      - [0x4C9B1, c, ui/field_text_window_api]
      - [0x4CD99, c, runtime/field_block_allocator]
      - [0x4CFF1, c, actors/field_actor_target_queries]
      - [0x4D869, c, actors/field_actor_effects]
      - [0x520D9, c, actors/field_path_interpolation]

      # Command history, audio, dialogs, and field UI.
      - [0x528ED, c, actors/field_command_history]
      - [0x531D1, c, ui/field_pair_indicators]
      - [0x538C5, c, runtime/field_audio_runtime]
      - [0x54779, c, ui/field_ring_selection]
      - [0x559C9, c, ui/field_dialog_screens]
      - [0x58C31, c, ui/field_modal_runtime]
      - [0x5D3C1, c, ui/field_modal_stream_start]
