name: GOSUB.BIN
sha1: 1361a14f2d461fd99c2e9d5d4f5e70b7704bb098
options:
  base_path: ../../../
  basename: GOSUB.BIN
  platform: psx
  compiler: PSYQ
  # include/include_asm.h, macro.inc, labels.inc and gte_macros.inc are
  # project-owned (include_asm.h prefixes the per-version asm directory),
  # so splat must not regenerate them.
  generate_asm_macros_files: False
  target_path: disc/us/BIN/GOSUB.BIN
  extensions_path: tools/splat_ext
  asset_path: assets/us
  elf_path: build/us/overlays/gosub.elf

  # Overlay-specific output paths (separate from SLUS)
  asm_path: asm/us/overlays/gosub
  src_path: src/overlays/gosub
  build_path: build/us/overlays/gosub

  ld_script_path: linker/us/overlays/gosub/gosub.ld
  ld_dependencies: True
  undefined_funcs_auto_path: linker/us/overlays/gosub/undefined_funcs_auto.txt
  undefined_syms_auto_path: linker/us/overlays/gosub/undefined_syms_auto.txt

  symbol_addrs_path:
    - config/us/symbols/shared_symbol_addrs.txt
    - config/us/symbols/gosub_symbol_addrs.txt

  find_file_boundaries: False
  make_full_disasm_for_code: True
  use_legacy_include_asm: False
  o_as_suffix: True
  subalign: 2

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  string_encoding: ASCII
  data_string_encoding: ASCII

segments:
  - name: gosub
    type: decompress_overlay
    start: 0x1
    vram: 0x80140000
    align: 4
    subsegments:
      - [auto, c, overlay_header]
      - [0x1, .rodata, overlay_header]
      - [0x5, .rodata, gosub]
      - [0x55, .rodata, gosub_selection]
      - start: 0x69
        type: rodatabin
        name: group_first_indices
        dir: gosub
      - start: 0x75
        type: rodatabin
        name: group_counts
        dir: gosub
      - [0x81, c, gosub]       # CDK (default)
      - [0xC19, c, gosub_elements]
      - [0x16E1, c, gosub_lists]
      - [0x229D, c, gosub_selection]
      - [0x3259, c, gosub_runtime]
      - [0x3B65, c, gosub_render]
      - [0x54C5, c, gosub_dialogs]
      - [0x65BD, c, gosub_helpers]
      - start: 0x7059
        type: databin
        name: image_archive
        dir: gosub
      - start: 0xF27D
        type: databin
        name: text_archive
        dir: gosub
      - start: 0x12DF5
        type: databin
        name: portrait_archive
        dir: gosub
      - start: 0x2B3DD
        type: databin
        name: font_texture
        dir: gosub
      - start: 0x2B5AD
        type: databin
        name: item_metadata
        dir: gosub
      - start: 0x2B635
        type: databin
        name: glyph_metrics
        dir: gosub
      - [0x2B8C9, .bss, gosub]
  - [0x34A5D]
