<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
<title id="title">The whole footprint has to fit</title><desc id="desc">Two views of the same narrow opening. A small collision rectangle fits; a wider rectangle touches the walls.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<rect width="1040" height="420" rx="16" fill="white"/>
<text x="28" y="40" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#223449" font-weight="bold" text-anchor="start">The sprite is not the thing being tested</text>
<text x="28" y="72" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#586c80" font-weight="normal" text-anchor="start">The route has to leave room for the whole collision rectangle.</text>
<text x="42" y="119" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#223449" font-weight="bold" text-anchor="start">Small footprint</text>
<rect x="68" y="145" width="150" height="170" rx="5" fill="#53657a" stroke="none"/>
<rect x="286" y="145" width="150" height="170" rx="5" fill="#53657a" stroke="none"/>
<polyline points="252,344 252,159" fill="none" stroke="#087e83" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<rect x="231.0" y="216" width="42" height="70" rx="4" fill="#c9ece4" stroke="#087e83"/>
<circle cx="252" cy="251" r="5" fill="#087e83" stroke="white" stroke-width="2"/>
<text x="252" y="257" font-family="DejaVu Sans, sans-serif" font-size="18" fill="white" font-weight="bold" text-anchor="middle"></text>
<text x="252" y="382" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#087e83" font-weight="normal" text-anchor="middle">Fits through the opening</text>
<text x="564" y="119" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#223449" font-weight="bold" text-anchor="start">Larger footprint</text>
<rect x="590" y="145" width="150" height="170" rx="5" fill="#53657a" stroke="none"/>
<rect x="808" y="145" width="150" height="170" rx="5" fill="#53657a" stroke="none"/>
<polyline points="774,344 774,159" fill="none" stroke="#bf3f47" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<rect x="722.0" y="216" width="104" height="70" rx="4" fill="#f7d9dc" stroke="#bf3f47"/>
<circle cx="774" cy="251" r="5" fill="#bf3f47" stroke="white" stroke-width="2"/>
<text x="774" y="257" font-family="DejaVu Sans, sans-serif" font-size="18" fill="white" font-weight="bold" text-anchor="middle"></text>
<text x="774" y="382" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#bf3f47" font-weight="normal" text-anchor="middle">The centre fits. The rectangle does not.</text>
</svg>
