name: Build and Progress Report

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

jobs:
  tool-tests:
    name: Tool tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: python3 -m pip install 'PyYAML>=6.0' 'libclang==18.1.1'

      - name: Run tool tests
        run: make test-tools

  build-and-report:
    name: ${{ matrix.rom_id }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: us
            rom_id: SLUS_010.13
            verify: true
          - version: jp
            rom_id: SLPS_021.70
            verify: true

    container:
      image: ghcr.io/celophi/slus-01013:v6.0

    env:
      VERSION: ${{ matrix.version }}
      ROM_ID: ${{ matrix.rom_id }}
      WORKING_DIR: lom

      OBJDIFF_CLI: objdiff-cli
      OBJDIFF_CONFIG_GENERATOR: tools/objdiff/generate_objdiff_config.py

      PROGRESS_REPORT: build/${{ matrix.version }}/progress.json

    defaults:
      run:
        working-directory: lom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.WORKING_DIR }}
          submodules: recursive
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install pinned objdiff CLI
        run: sh tools/objdiff/install_objdiff.sh /usr/local/bin/objdiff-cli

      - name: Copy ROM from container
        run: |
          mkdir -p disc/${{ env.VERSION }}/BIN
          cp /rom/${{ env.VERSION }}/${{ env.ROM_ID }} disc/${{ env.VERSION }}/
          cp /rom/${{ env.VERSION }}/BIN/*.BIN disc/${{ env.VERSION }}/BIN/

      - name: Setup Python environment
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Split ROM with splat
        run: make splat VERSION=${{ env.VERSION }}

      - name: Build objects for comparison
        run: |
          make clean VERSION=${{ env.VERSION }}
          make objdiff-objects VERSION=${{ env.VERSION }}

      - name: Verify compressed overlay BINs against ROM
        if: ${{ matrix.verify }}
        run: make verify-bins VERSION=${{ env.VERSION }}

      - name: Native compile check
        run: make native-check VERSION=${{ env.VERSION }}

      - name: Generate objdiff configuration
        run: python3 ${{ env.OBJDIFF_CONFIG_GENERATOR }} --version ${{ env.VERSION }}

      - name: Generate progress report
        run: |
          ${{ env.OBJDIFF_CLI }} report generate -o ${{ env.PROGRESS_REPORT }}

      - name: Verify the host build of the data
        if: ${{ matrix.verify }}
        run: make verify-data-host VERSION=${{ env.VERSION }}

      - name: Verify binaries with data built from generated C
        if: ${{ matrix.verify }}
        run: make verify-data-as-c VERSION=${{ env.VERSION }}

      - name: Unit tests for tools/verification/data2c
        run: |
          apt-get update && apt-get install -y --no-install-recommends clang
          python3 -m unittest discover -s tools/verification/data2c/tests

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ROM_ID }}_report
          path: ${{ env.WORKING_DIR }}/${{ env.PROGRESS_REPORT }}
          if-no-files-found: error
