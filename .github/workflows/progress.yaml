name: Build and Progress Report

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

jobs:
  build-and-report:
    # One job per game version (see mk/version.mk). Each builds its own objects
    # and uploads its own progress report, named after the version's main
    # executable (e.g. SLUS_010.13_report, SLPS_021.70_report).
    name: ${{ matrix.rom_id }}
    runs-on: ubuntu-latest

    strategy:
      # A failure in one version must not cancel the other's report.
      fail-fast: false
      matrix:
        include:
          - version: us
            rom_id: SLUS_010.13
            # Fully linked: verify every rebuilt binary against the disc.
            verify: true
          - version: jp
            rom_id: SLPS_021.70
            # First-pass disassembly only: nothing links yet, so skip the
            # binary checks and report the splat assembly as 0% matched.
            verify: false

    container:
      # The CI image holds every disc under /rom/<version>/.
      image: ghcr.io/celophi/slus-01013:v6.0

    env:
      VERSION: ${{ matrix.version }}
      ROM_ID: ${{ matrix.rom_id }}
      WORKING_DIR: lom

      # Tool paths (relative to working directory)
      OBJDIFF_CLI: ./tools/objdiff/objdiff-cli-linux-x86_64
      OBJDIFF_CONFIG_GENERATOR: tools/objdiff/generate_objdiff_config.py

      # Build artifacts
      PROGRESS_REPORT: build/${{ matrix.version }}/progress.json

    defaults:
      run:
        working-directory: lom

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.WORKING_DIR }}
          submodules: recursive
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Copy ROM from container
        run: |
          mkdir -p disc/${{ env.VERSION }}/BIN
          cp /rom/${{ env.VERSION }}/${{ env.ROM_ID }} disc/${{ env.VERSION }}/
          cp /rom/${{ env.VERSION }}/BIN/*.BIN disc/${{ env.VERSION }}/BIN/

      - name: Setup Python environment
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Split ROM with splat
        run: make splat VERSION=${{ env.VERSION }}

      - name: Build objects for comparison
        run: |
          make clean VERSION=${{ env.VERSION }}
          make objdiff-objects VERSION=${{ env.VERSION }}

      - name: Verify compressed overlay BINs against ROM
        if: ${{ matrix.verify }}
        # Builds each verifiable overlay's compressed .BIN and SHA1-compares it
        # against the original ROM file. On match, the overlay name is appended
        # to build/<version>/complete_overlays.txt, which the objdiff config
        # generator reads to stamp metadata.complete = true on those units.
        run: make verify-bins VERSION=${{ env.VERSION }}

      - name: Generate objdiff configuration
        run: python3 ${{ env.OBJDIFF_CONFIG_GENERATOR }} --version ${{ env.VERSION }}

      - name: Generate progress report
        run: |
          chmod +x ${{ env.OBJDIFF_CLI }}
          ${{ env.OBJDIFF_CLI }} report generate -o ${{ env.PROGRESS_REPORT }}

      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ROM_ID }}_report
          path: ${{ env.WORKING_DIR }}/${{ env.PROGRESS_REPORT }}
          if-no-files-found: error
